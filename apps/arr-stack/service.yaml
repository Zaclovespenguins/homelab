# Single multi-port LoadBalancer instead of five separate Services -
# one LB IP for the whole stack, ports match compose's gluetun mappings.
apiVersion: v1
kind: Service
metadata:
  name: arr-stack
  namespace: arr-stack
spec:
  type: LoadBalancer
  selector: { app: arr-stack }
  ports:
    - name: qbittorrent
      port: 8489
      targetPort: 8489
    - name: prowlarr
      port: 9696
      targetPort: 9696
    - name: sonarr
      port: 8989
      targetPort: 8989
    - name: radarr
      port: 7878
      targetPort: 7878
    - name: mylar
      port: 8091
      targetPort: 8090
