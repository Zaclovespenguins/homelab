apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: open-webui }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: owui-pg-app, key: uri }
            - name: VECTOR_DB
              value: pgvector
            - name: PGVECTOR_DB_URL
              valueFrom:
                secretKeyRef: { name: owui-pg-app, key: uri }
            - name: OLLAMA_BASE_URL
              value: http://100.67.130.2:11434
            - name: ENABLE_WEBSOCKET_SUPPORT
              value: "true"
          envFrom:
            - secretRef: { name: owui-secrets }
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { memory: "1Gi", cpu: "250m" }
            limits:   { memory: "4Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
